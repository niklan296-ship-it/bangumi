<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бангуми</title>
<meta name="description" content="Мой аниме-список и расписание серий">
<meta name="theme-color" content="#EEF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10122A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner wrap">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">番</span><span id="pageTitle">Расписание</span></h1>
    <span class="season" id="seasonLabel"></span>
  </div>
</header>

<main id="main" class="wrap">
  <section id="view-schedule" class="view" aria-label="Расписание"></section>
  <section id="view-list" class="view" aria-label="Мой список" hidden></section>
  <section id="view-search" class="view" aria-label="Поиск" hidden></section>
  <section id="view-more" class="view" aria-label="Ещё" hidden></section>
</main>

<nav class="tabbar" aria-label="Разделы">
  <a href="#schedule" data-tab="schedule">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Расписание</span>
  </a>
  <a href="#list" data-tab="list">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
    <span>Мой список</span>
  </a>
  <a href="#search" data-tab="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/></svg>
    <span>Поиск</span>
  </a>
  <a href="#more" data-tab="more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
    <span>Ещё</span>
  </a>
</nav>

<div id="sheetRoot" class="sheet-root" hidden>
  <div class="backdrop" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
