<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC23D"/><stop offset=".55" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF4D8D"/>

  </defs>
</svg>

<header class="appbar" id="appbar">
  <div class="appbar-inner wrap">
    <a class="logo" href="#home" data-tab-link="home" aria-label="Бангуми, на главную">
      <span class="logo-mark" aria-hidden="true">番</span><span class="logo-word" data-t>Бангуми</span>

  <section id="view-search" class="view pad-top wrap" aria-label="Поиск" hidden></section>

  <div class="tabbar-inner">
    <a href="#home" data-tab="home">
      <span class="ib"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg></span>

    <a href="#search" data-tab="search" class="fab">

      <span data-t>Мой список</span>
    </a>
    <a href="#profile" data-tab="profile">
