name: Собрать APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка
        id: build
        continue-on-error: true
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "java: $JAVA_HOME"; "$JAVA_HOME/bin/java" -version
          echo "android sdk: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          G=/tmp/gradle-8.7/bin/gradle
          if [ -z "$KEYSTORE_B64" ]; then
            echo "NOKEY: нет секрета KEYSTORE_B64 — проверяю debug-сборку"
            $G -p android assembleDebug --stacktrace --no-daemon
            echo "NOKEY: debug-сборка прошла"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/bangumi.jks
          $G -p android assembleRelease --stacktrace --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Bangumi.apk

      - name: Выпуск
        id: release
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Бангуми 1.${{ github.run_number }}
          body: Установи Bangumi.apk на телефон. Переустанавливать APK нужно редко — интерфейс обновляется сам через интернет.
          files: Bangumi.apk
          make_latest: true

      - name: Отчёт в ветку apk
        if: always()
        run: |
          mkdir -p out
          echo "build=${{ steps.build.outcome }} release=${{ steps.release.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > out/status.txt
          tail -c 300000 build.log > out/build.log 2>/dev/null || echo "нет build.log" > out/build.log
          [ -f Bangumi.apk ] && cp Bangumi.apk out/ || true
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Итог
        if: steps.build.outcome != 'success'
        run: exit 1
